<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY HUB — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F6;
    --bg-hover: #F2F0EB;
    --text: #1A1A1A;
    --text-muted: #6B6863;
    --border: #E5E3DE;
    --accent: #4A6D80;
    --accent-strong: #3A5665;
    --accent-tint: #EAEFF2;

    --font-logo: 'EB Garamond', Georgia, serif;
    --font-body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

    --ease: cubic-bezier(0.2, 0, 0.2, 1);
    --duration-fast: 150ms;
    --duration-base: 220ms;
    --duration-slow: 400ms;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  a {
    color: inherit;
  }

  /* ---------- Header ---------- */

  .site-header {
    height: 64px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-logo {
    font-family: var(--font-mono), var(--font-body);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: var(--text);
    transition: color var(--duration-fast) var(--ease);
  }

  .header-logo:hover {
    color: var(--text-muted);
  }

  .header-logo:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .header-name {
    font-family: var(--font-mono), var(--font-body);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0;
    text-decoration: none;
    color: var(--text);
    transition: color var(--duration-fast) var(--ease);
  }

  .header-name:hover {
    color: var(--text-muted);
  }

  .header-name:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Main / Grid ---------- */

  .projects-main {
    flex: 1;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px;
  }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }

  .card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--bg);
    overflow: hidden;
    text-decoration: none;
    transform: translateY(0);
    transition: background var(--duration-fast) var(--ease),
                border-color var(--duration-fast) var(--ease),
                transform var(--duration-fast) var(--ease);
  }

  .card-thumb {
    aspect-ratio: 4 / 3;
    background: var(--bg-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }

  .card-thumb-number {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--border);
  }

  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
  }

  .card-order {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .card-title {
    font-family: var(--font-body);
    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
  }

  .card-tagline {
    flex: 1;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text-muted);
  }

  .badge {
    align-self: flex-start;
    font-family: var(--font-mono), var(--font-body);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 2px;
  }

  .badge-coming-soon {
    background: none;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .badge-in-progress {
    background: var(--accent-tint);
    color: var(--accent-strong);
  }

  .badge-done {
    background: var(--accent);
    color: var(--bg);
  }

  /* coming-soon: 클릭 불가, hover 변화 없음 */
  .card.is-disabled {
    opacity: 0.55;
    cursor: default;
  }

  /* 활성 카드(진행중/완료)만 hover 반응 */
  .card:not(.is-disabled) {
    cursor: pointer;
  }

  .card:not(.is-disabled):hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card:not(.is-disabled):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 1023px) {
    .project-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 639px) {
    .header-inner {
      padding: 0 24px;
    }
    .projects-main {
      padding: 24px;
    }
    .project-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }
  }

  /* ---------- Footer ---------- */

  .site-footer {
    border-top: 1px solid var(--border);
  }

  .footer-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 48px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .footer-link {
    font-family: var(--font-mono), var(--font-body);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.06em;
    line-height: 1.7;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color var(--duration-fast) var(--ease);
  }

  .footer-link:hover {
    color: var(--accent-strong);
  }

  .footer-link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 639px) {
    .footer-inner {
      padding: 32px 24px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- Detail Modal ---------- */

  body.modal-open {
    overflow: hidden;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 26, 26, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }

  .modal-overlay[hidden] {
    display: none;
  }

  .modal-box {
    width: 100%;
    max-width: 560px;
    max-height: min(640px, 90vh);
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 40px 56px;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    border-radius: 2px;
    transition: color var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease);
  }

  .modal-close:hover {
    color: var(--text);
    background: var(--bg-hover);
  }

  .modal-close:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .modal-image {
    aspect-ratio: 16 / 10;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .modal-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }

  .modal-order {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .modal-title {
    margin-top: 8px;
    font-family: var(--font-body);
    font-size: 26px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--text);
    padding-right: 24px;
  }

  .modal-tagline {
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-muted);
  }

  .modal-meta {
    margin-top: 16px;
    font-family: var(--font-mono), var(--font-body);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    line-height: 1.8;
  }

  .modal-sections {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .modal-section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .modal-section-text {
    font-size: 17px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-line;
  }

  .modal-section-list {
    margin: 0;
    padding-left: 20px;
    font-size: 17px;
    line-height: 1.75;
    color: var(--text);
  }

  .modal-section-list li + li {
    margin-top: 4px;
  }

  .modal-tech {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tech-badge {
    font-family: var(--font-mono), var(--font-body);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--accent-strong);
    background: var(--accent-tint);
    border-radius: 2px;
    padding: 4px 8px;
  }

  .modal-actions {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .modal-link-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono), var(--font-body);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px 24px;
    text-decoration: none;
    transition: background var(--duration-fast) var(--ease), border-color var(--duration-fast) var(--ease);
  }

  .modal-link-secondary:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
  }

  .modal-link-secondary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .modal-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono), var(--font-body);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--text);
    border-radius: 2px;
    padding: 12px 24px;
    text-decoration: none;
    transition: background var(--duration-fast) var(--ease);
  }

  .modal-link:hover {
    background: var(--accent-strong);
  }

  .modal-link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-logo" href="index.html">MY HUB</a>
      <span class="header-name">채슬</span>
    </div>
  </header>

  <main class="projects-main">
    <div class="project-grid" id="project-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="footer-link" href="mailto:hello@example.com">hello@example.com</a>
      <a class="footer-link" href="https://github.com/0toiiot0" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="닫기">&times;</button>
      <div class="modal-image" id="modal-image" hidden><img id="modal-image-img" src="" alt=""></div>
      <span class="modal-order" id="modal-order"></span>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-tagline" id="modal-tagline"></p>
      <p class="modal-meta" id="modal-meta"></p>
      <div class="modal-sections" id="modal-sections"></div>
      <div class="modal-tech" id="modal-tech"></div>
      <div class="modal-actions">
        <a class="modal-link" id="modal-link" target="_blank" rel="noopener">사이트로 이동 &rarr;</a>
        <a class="modal-link-secondary" id="modal-github" target="_blank" rel="noopener">GitHub &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    // data/projects.ts (PRD §6)와 동일한 구조. 지금은 전부 coming-soon.
    const projects = [
      {
        order: 1,
        status: 'done',
        title: '자리 있어',
        tagline: '음식점 리뷰 웹앱',
        description: '여럿이 모일 약속 장소를 정할 때, 후기를 먼저 확인하고 만족스러운 자리를 고를 수 있는 서비스 "자리있어"의 랜딩 페이지입니다. 인기 맛집과 후기를 보여주며, AI 리뷰 요약·감성 분석·통계 대시보드는 추후 추가될 예정입니다. (현재 데이터는 데모용 가짜 정보)',
        features: [
          '인기 맛집 목록 확인',
          '방문자 후기 확인',
        ],
        troubleshooting: '',
        period: '2026.08.14',
        role: '1인 개발 (기획·디자인·개발)',
        tech: ['HTML', 'CSS', 'JavaScript', 'Vercel'],
        link: 'https://food-review-gamma.vercel.app/',
        github: 'https://github.com/0toiiot0/FoodReview',
        thumb: 'assets/thumbnails/food-review.jpg',
      },
      {
        order: 2,
        status: 'done',
        title: '세계 랜드마크 날씨',
        tagline: '전 세계 날씨를 살펴보는 실시간 기상 정보 서비스',
        description: '지금 저기는 어떨까? 전 세계 유명 랜드마크의 실시간 날씨를 한눈에 확인할 수 있는 서비스입니다. 지역별 날씨를 조회하고 조건에 따라 필터링할 수 있습니다.',
        features: [
          '전 세계 주요 랜드마크 실시간 날씨 조회',
          '조건별 위치 검색 및 필터링',
        ],
        troubleshooting: '',
        period: '2026.08.18',
        role: '1인 개발 (기획·디자인·개발)',
        tech: ['HTML', 'CSS', 'JavaScript', 'Vercel'],
        link: 'https://weather-site-rho-one.vercel.app/',
        github: 'https://github.com/0toiiot0/weather_site',
        thumb: 'assets/thumbnails/weather-site.jpg',
      },
      {
        order: 3,
        status: 'done',
        title: '한 번에 검색',
        tagline: '키워드로 읽는 뉴스',
        description: '관심 있는 주제를 직접 입력하거나 인기 키워드(미중 관계, 금리 인하, 스마트폰 신제품, 전기차 보조금, 우주 개발 등)를 눌러 관련 뉴스를 바로 찾아볼 수 있는 뉴스 검색 서비스입니다. 네이버 검색 API를 활용해 키워드별 최신 뉴스를 모아 보여줍니다.',
        features: [
          '키워드 직접 검색으로 관련 뉴스 조회',
          '인기 키워드 버튼으로 빠른 뉴스 탐색',
        ],
        troubleshooting: '',
        period: '2026.08.18',
        role: '1인 개발 (기획·디자인·개발)',
        tech: ['HTML', 'CSS', 'JavaScript', 'Naver Search API', 'Vercel'],
        link: 'https://news-site-123-a4c3.vercel.app/',
        github: 'https://github.com/0toiiot0/news_site',
        thumb: 'assets/thumbnails/caputhe.jpg',
      },
      { order: 4, status: 'coming-soon', title: null },
      { order: 5, status: 'coming-soon', title: null },
      { order: 6, status: 'coming-soon', title: null },
      { order: 7, status: 'coming-soon', title: null },
      { order: 8, status: 'coming-soon', title: null },
    ];

    const badgeMap = {
      'coming-soon': { text: 'COMING SOON', className: 'badge-coming-soon' },
      'in-progress': { text: 'IN PROGRESS', className: 'badge-in-progress' },
      'done': { text: 'DONE', className: 'badge-done' },
    };

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function renderCard(project) {
      const orderLabel = pad(project.order);
      const isComingSoon = project.status === 'coming-soon';
      const badge = badgeMap[project.status];
      const title = project.title || 'Coming Soon';
      const tagline = project.tagline || '';

      const card = document.createElement(isComingSoon ? 'div' : 'button');
      card.className = 'card' + (isComingSoon ? ' is-disabled' : '');
      if (isComingSoon) {
        card.setAttribute('aria-disabled', 'true');
      } else {
        card.type = 'button';
      }

      const thumbContent = project.thumb
        ? '<img src="' + project.thumb + '" alt="' + title + ' 썸네일" loading="lazy">'
        : '<span class="card-thumb-number">' + orderLabel + '</span>';

      card.innerHTML =
        '<div class="card-thumb">' + thumbContent + '</div>' +
        '<div class="card-body">' +
          '<span class="card-order">' + orderLabel + '</span>' +
          '<h2 class="card-title">' + title + '</h2>' +
          '<p class="card-tagline">' + tagline + '</p>' +
          '<span class="badge ' + badge.className + '">' + badge.text + '</span>' +
        '</div>';

      if (!isComingSoon) {
        card.addEventListener('click', function () {
          openModal(project, card);
        });
      }

      return card;
    }

    const grid = document.getElementById('project-grid');
    projects.forEach(function (project) {
      grid.appendChild(renderCard(project));
    });

    // ---------- Detail Modal ----------

    const overlay = document.getElementById('modal-overlay');
    const modalClose = document.getElementById('modal-close');
    const modalOrder = document.getElementById('modal-order');
    const modalTitle = document.getElementById('modal-title');
    const modalTagline = document.getElementById('modal-tagline');
    const modalImage = document.getElementById('modal-image');
    const modalImageImg = document.getElementById('modal-image-img');
    const modalMeta = document.getElementById('modal-meta');
    const modalSections = document.getElementById('modal-sections');
    const modalTech = document.getElementById('modal-tech');
    const modalLink = document.getElementById('modal-link');
    const modalGithub = document.getElementById('modal-github');
    let lastFocusedCard = null;

    function openModal(project, triggerEl) {
      lastFocusedCard = triggerEl;
      modalOrder.textContent = pad(project.order);
      modalTitle.textContent = project.title || '';
      modalTagline.textContent = project.tagline || '';

      if (project.thumb) {
        modalImageImg.src = project.thumb;
        modalImageImg.alt = (project.title || '') + ' 썸네일';
        modalImage.hidden = false;
      } else {
        modalImage.hidden = true;
      }

      modalSections.innerHTML = '';
      const sections = [
        { title: '프로젝트 소개', text: project.description },
        { title: '주요 기능', list: project.features },
        { title: '트러블슈팅', text: project.troubleshooting },
      ];
      sections.forEach(function (section) {
        const hasList = Array.isArray(section.list) && section.list.length > 0;
        const hasText = !hasList && section.text;
        if (!hasList && !hasText) return;

        const wrap = document.createElement('div');
        wrap.className = 'modal-section';

        const heading = document.createElement('h3');
        heading.className = 'modal-section-title';
        heading.textContent = section.title;
        wrap.appendChild(heading);

        if (hasList) {
          const ul = document.createElement('ul');
          ul.className = 'modal-section-list';
          section.list.forEach(function (item) {
            const li = document.createElement('li');
            li.textContent = item;
            ul.appendChild(li);
          });
          wrap.appendChild(ul);
        } else {
          const p = document.createElement('p');
          p.className = 'modal-section-text';
          p.textContent = section.text;
          wrap.appendChild(p);
        }

        modalSections.appendChild(wrap);
      });

      const metaParts = [project.period, project.role].filter(Boolean);
      modalMeta.textContent = metaParts.join(' · ');
      modalMeta.hidden = metaParts.length === 0;

      modalTech.innerHTML = '';
      const techList = project.tech || [];
      modalTech.hidden = techList.length === 0;
      techList.forEach(function (tech) {
        const badge = document.createElement('span');
        badge.className = 'tech-badge';
        badge.textContent = tech;
        modalTech.appendChild(badge);
      });

      if (project.link) {
        modalLink.href = project.link;
        modalLink.hidden = false;
      } else {
        modalLink.hidden = true;
      }

      if (project.github) {
        modalGithub.href = project.github;
        modalGithub.hidden = false;
      } else {
        modalGithub.hidden = true;
      }

      overlay.hidden = false;
      document.body.classList.add('modal-open');
      modalClose.focus();
    }

    function closeModal() {
      overlay.hidden = true;
      document.body.classList.remove('modal-open');
      if (lastFocusedCard) {
        lastFocusedCard.focus();
        lastFocusedCard = null;
      }
    }

    modalClose.addEventListener('click', closeModal);

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        closeModal();
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !overlay.hidden) {
        closeModal();
      }
    });
  </script>
</body>
</html>
